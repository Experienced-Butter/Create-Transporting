name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      - name: Build and test
        run: ./gradlew build test --no-daemon --stacktrace

      # The dedicated server must start with the built jar: this catches client-only classes
      # leaking into the common side (they crash the server during mod construction).
      - name: Dedicated server smoke test
        run: |
          mkdir -p jar-smoke/run/mods
          rm -f jar-smoke/run/mods/*.jar
          cp build/libs/create_village_transit-*.jar jar-smoke/run/mods/
          echo "eula=true" > jar-smoke/run/eula.txt
          ./gradlew -p jar-smoke runServer --no-daemon --console=plain > server.log 2>&1 &
          SERVER_PID=$!
          ok=0
          for i in $(seq 1 90); do
            if grep -q "Done (" server.log; then ok=1; break; fi
            if grep -qE "ModLoadingException|Failed to create mod instance|Failed to start the minecraft server" server.log; then
              echo "dedicated server failed to load the mod"
              tail -n 120 server.log
              kill $SERVER_PID 2>/dev/null || true
              exit 1
            fi
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            echo "dedicated server did not finish loading in time"
            tail -n 120 server.log
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          kill $SERVER_PID 2>/dev/null || true
          pkill -f "net.neoforged" 2>/dev/null || true
          echo "smoke test passed"

      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: create-village-transit
          path: build/libs/*.jar
          if-no-files-found: error
