name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      - name: Build and test
        run: ./gradlew build test --no-daemon --stacktrace

      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: create-village-transit
          path: build/libs/*.jar
          if-no-files-found: error
